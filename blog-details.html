<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Article Details - Kaushubh Kumar Blog</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" type="text/css" href="assets/css/style.css">
      <!-- Add AOS CSS -->
      <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
      <!-- Add AOS JavaScript -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
      <style type="text/css">
         .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            animation: slide-up 0.5s ease-out forwards;
         }

         @keyframes slide-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
         }
      </style>
   </head>
   <body class="bg-nude-dark">
      <div class="loader"></div>
      <div class="container-fluid">
         <div class="nav-left" data-aos="fade-up">
            <div class="nav-left-item"><a href="blog.html" class="nav-left-link is-pink">BLOG</a></div>
            <div class="nav-line is-pink"></div>
            <div class="nav-left-item nav-copyright">
               <div class="copyright">©/2025</div>
            </div>
         </div>
         <div class="wrapper w-clearfix">
            <div class="section-left section-long" style="width: 100%; max-width: 960px; margin: 0 auto;">
               <div id="single-article-view">
                  <div class="content py-5">
                     <p class="description">Loading article details...</p>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <script type="text/javascript">
         AOS.init({
            duration: 1000,
            once: true,
         });

         setTimeout(() => {
            const loader = document.querySelector('.loader');
            if (loader) loader.remove();
         }, 800);
      </script>
      <script src="assets/js/blog.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
   </body>
</html>
