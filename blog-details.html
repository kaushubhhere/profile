<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Article Details - Kaushubh Kumar Blog</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" type="text/css" href="assets/css/style.css">
      <!-- AOS CSS -->
      <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
      <!-- AOS JavaScript -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

      <style type="text/css">
         .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            animation: slide-up 0.5s ease-out forwards;
            animation-delay: 0s;
         }

         @keyframes slide-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
         }

         .category-tag {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: #2b2b2b;
            color: #ffffff;
            display: inline-block;
         }

         .read-link {
            font-family: Grandslang roman, sans-serif;
            font-size: 18px;
            color: #2b2b2b;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
         }

         .read-link:hover {
            color: #e76f51;
            text-decoration: none;
         }
      </style>
   </head>
   <body class="bg-nude">
      <div class="loader"></div>
      <div class="container-fluid">
         <!-- Left Navigation -->
         <div class="nav-left" data-aos="fade-up">
            <div class="nav-left-item"><a href="index.html" class="nav-left-link">HOME</a></div>
            <div class="nav-line"></div>
            <div class="nav-left-item nav-copyright">
               <div class="copyright">©/2025</div>
            </div>
         </div>

         <!-- Main Article Reader Content -->
         <div class="wrapper">
            <div class="section-left section-long">
               <div class="content">
                  
                  <div id="single-article-content" data-aos="fade-up">
                     <!-- Dynamic Article Reader Content -->
                     <div class="text-center py-5">
                        <div class="spinner-border text-dark" role="status">
                           <span class="visually-hidden">Loading article...</span>
                        </div>
                     </div>
                  </div>

               </div>
            </div>
         </div>
      </div>

      <script type="text/javascript">
         AOS.init({
            duration: 1000,
            once: true,
         });

         setTimeout(() => {
            const loader = document.querySelector('.loader');
            if (loader) loader.remove();
         }, 800);
      </script>
      <script src="assets/js/blog.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
   </body>
</html>
