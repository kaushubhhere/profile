<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kaushubh Kumar - Blog</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" type="text/css" href="assets/css/style.css">
      <!-- Add AOS CSS -->
      <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
      <!-- Add AOS JavaScript -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
      <style type="text/css">
         .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            animation: slide-up 0.5s ease-out forwards;
         }

         @keyframes slide-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
         }

         .blog-filter-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--offwhite);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
            transition: all 0.25s ease;
         }

         .blog-filter-btn:hover, .blog-filter-btn.active {
            background: var(--coral);
            border-color: var(--coral);
            color: #ffffff;
         }
      </style>
   </head>
   <body class="bg-nude-dark">
      <div class="loader"></div>
      <div class="container-fluid">
         <div class="nav-left" data-aos="fade-up">
            <div class="nav-left-item"><a href="index.html" class="nav-left-link is-pink">HOME</a></div>
            <div class="nav-line is-pink"></div>
            <div class="nav-left-item nav-copyright">
               <div class="copyright" data-aos="fade-right">©/2025</div>
            </div>
         </div>
         <div class="wrapper w-clearfix">
            <div class="section-left">
               <div class="content content-main">
                  <div class="header-mask">
                     <h1 style="transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;" class="header swipe-up" data-aos="fade-up">BLOG</h1>
                  </div>
                  <div class="description-mask">
                     <p style="transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;" class="description" data-aos="fade-up">
                        Latest updates & articles on Web Development, PHP, JavaScript, and AI Coding.<br>
                     </p>
                  </div>
                  <div class="description-mask">
                     <p style="transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;" class="description mt-3" data-aos="fade-up">
                        <small id="sync-info" style="color: var(--coral);">Auto-refreshes every 2 days</small> <button id="refresh-btn" class="blog-filter-btn ms-2" style="font-size: 12px; padding: 4px 10px;">Refresh Feed ↻</button>
                     </p>
                  </div>

                  <!-- Topic Category Filters -->
                  <div class="mt-4" data-aos="fade-up">
                     <button class="blog-filter-btn active" data-category="all">All</button>
                     <button class="blog-filter-btn" data-category="web">Web Dev</button>
                     <button class="blog-filter-btn" data-category="php">PHP</button>
                     <button class="blog-filter-btn" data-category="js">JavaScript</button>
                     <button class="blog-filter-btn" data-category="ai">AI</button>
                  </div>
               </div>
            </div>
            <div class="section-right section-long">
               <div class="w-dyn-list">
                  <div id="news-items-container" role="list" class="nav w-dyn-items">
                     <div class="nav-item">
                        <p class="description">Loading latest articles...</p>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <script type="text/javascript">
         AOS.init({
            duration: 1000,
            once: true,
         });

         setTimeout(() => {
            const loader = document.querySelector('.loader');
            if (loader) loader.remove();
         }, 800);
      </script>
      <script src="assets/js/blog.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
   </body>
</html>
