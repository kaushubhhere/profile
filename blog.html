<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kaushubh Kumar - Blog & Coding News</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
      <link rel="stylesheet" type="text/css" href="assets/css/style.css">
      <!-- AOS CSS -->
      <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
      <!-- AOS JavaScript -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

      <style type="text/css">
         body.bg-nude-dark {
            background-color: #0e0e0e;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         }

         .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            animation: slide-up 0.5s ease-out forwards;
            animation-delay: 0s;
         }

         @keyframes slide-up {
            0% { transform: translateY(0); }
            100% { transform: translateY(-100%); }
         }

         .blog-header {
            padding-top: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
         }

         .bg-success-custom {
            background-color: rgba(40, 167, 69, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.85rem;
         }

         .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
            margin-bottom: 35px;
         }

         .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #b0b0b0;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
         }

         .filter-btn:hover, .filter-btn.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
         }

         .news-card {
            background: #181818;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
         }

         .news-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
         }

         .card-img-wrapper {
            position: relative;
            height: 190px;
            overflow: hidden;
         }

         .card-img-top {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
         }

         .news-card:hover .card-img-top {
            transform: scale(1.05);
         }

         .category-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #fff;
         }

         .tag-web { border: 1px solid #3498db; color: #3498db; }
         .tag-php { border: 1px solid #9b59b6; color: #9b59b6; }
         .tag-js { border: 1px solid #f1c40f; color: #f1c40f; }
         .tag-ai { border: 1px solid #e74c3c; color: #e74c3c; }

         .read-more-btn {
            display: inline-flex;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
         }

         .read-more-btn .arrow {
            margin-left: 6px;
            transition: transform 0.2s ease;
         }

         .read-more-btn:hover {
            color: #3498db;
         }

         .read-more-btn:hover .arrow {
            transform: translateX(4px);
         }

         .refresh-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
         }

         .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
         }
      </style>
   </head>
   <body class="bg-nude-dark">
      <div class="loader"></div>
      <div class="container-fluid">
         <div class="nav-left" data-aos="fade-up">
            <div class="nav-left-item"><a href="index.html" class="nav-left-link is-pink">HOME</a></div>
            <div class="nav-line is-pink"></div>
            <div class="nav-left-item nav-copyright">
               <div class="copyright" data-aos="fade-right">©/2025</div>
            </div>
         </div>

         <div class="wrapper">
            <div class="section-left section-long w-100">
               <div class="content w-100 px-lg-5">
                  <!-- Header -->
                  <div class="blog-header mb-4" data-aos="fade-up">
                     <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
                        <h1 class="header header-large align-left mb-0" style="transform: none;">Coding & Tech News</h1>
                        <button id="refresh-news-btn" class="refresh-btn mt-2 mt-sm-0">🔄 Refresh Feed</button>
                     </div>
                     <p class="text-secondary mb-3">Live auto-updating developer news powered by Google News RSS & PHP/Web Tech feeds. Scheduled refresh every 2 days.</p>
                     
                     <div id="sync-status" class="d-inline-block">
                        <span class="badge bg-secondary">Initializing News Feed...</span>
                     </div>
                  </div>

                  <!-- Category Filters -->
                  <div class="filter-bar" data-aos="fade-up" data-aos-delay="100">
                     <button class="filter-btn active" data-category="all">All Topics</button>
                     <button class="filter-btn" data-category="web">Web Development</button>
                     <button class="filter-btn" data-category="php">PHP & Backend</button>
                     <button class="filter-btn" data-category="js">JavaScript & APIs</button>
                     <button class="filter-btn" data-category="ai">AI & Tools</button>
                  </div>

                  <!-- News Grid Container -->
                  <div id="news-grid" class="row">
                     <!-- Dynamic cards injected via blog.js -->
                     <div class="col-12 text-center py-5">
                        <div class="spinner-border text-light" role="status">
                           <span class="visually-hidden">Loading news...</span>
                        </div>
                        <p class="text-secondary mt-3">Fetching latest coding articles...</p>
                     </div>
                  </div>

               </div>
            </div>
         </div>
      </div>

      <script>
         AOS.init({
            duration: 1000,
            once: true,
         });

         setTimeout(() => {
            const loader = document.querySelector('.loader');
            if (loader) loader.remove();
         }, 800);
      </script>
      <script src="assets/js/blog.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
   </body>
</html>
